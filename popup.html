<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiLLORA AI Agent</title>
  <style>
    /* === COLOR PALETTE - Enhanced Vibrant Theme === */
    :root {
      --primary-400: #A78BFA;
      --primary-500: #8B5CF6;
      --primary-600: #7C3AED;
      --primary-700: #6D28D9;
      --accent-400: #60A5FA;
      --accent-500: #3B82F6;
      --accent-600: #2563EB;
      --success-400: #34D399;
      --success-500: #10B981;
      --success-600: #059669;
      --danger-400: #F87171;
      --danger-500: #EF4444;
      --danger-600: #DC2626;
      --warning-400: #FBBF24;
      --warning-500: #F59E0B;
      --warning-600: #D97706;
      --gray-50: #FAFAFA;
      --gray-100: #F5F5F5;
      --gray-200: #E5E5E5;
      --gray-300: #D4D4D4;
      --gray-400: #A3A3A3;
      --gray-500: #737373;
      --gray-600: #525252;
      --gray-700: #404040;
      --gray-800: #262626;
      --gray-900: #171717;
      --white: #FFFFFF;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --shadow-glow: 0 0 30px rgba(139, 92, 246, 0.4);
      --shadow-glow-strong: 0 0 40px rgba(139, 92, 246, 0.6);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* === RESET & BASE === */
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 450px;
      min-height: 650px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: var(--gray-900);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      position: relative;
    }

    /* === Animated Background Particles === */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float-particle 20s infinite;
    }

    @keyframes float-particle {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      25% { transform: translate(30px, -30px) scale(1.2); opacity: 0.5; }
      50% { transform: translate(-20px, -60px) scale(0.8); opacity: 0.2; }
      75% { transform: translate(40px, -40px) scale(1.1); opacity: 0.4; }
    }

    /* === LAYOUT === */
    .container {
      background: var(--white);
      min-height: 650px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* === HEADER === */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 32px 24px;
      color: var(--white);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -60%;
      right: -15%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -40%;
      left: -10%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, 20px) scale(1.1); }
    }

    .header-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-lg), 0 0 20px rgba(255, 255, 255, 0.3);
      animation: logo-pulse 3s ease-in-out infinite;
      position: relative;
    }

    .logo-icon::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(45deg, rgba(255, 255, 255, 0.4), transparent);
      border-radius: var(--radius-lg);
      animation: rotate-border 4s linear infinite;
      z-index: -1;
    }

    @keyframes logo-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes rotate-border {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .header-text h1 {
      font-size: 2.25rem;
      font-weight: 900;
      margin: 0 0 4px;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      animation: slide-in-left 0.6s ease backwards;
    }

    .header-text .subtitle {
      font-size: 0.9375rem;
      opacity: 0.95;
      font-weight: 500;
      margin: 0;
      animation: slide-in-left 0.6s ease backwards 0.1s;
    }

    @keyframes slide-in-left {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* === CONTENT === */
    .content {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
    }

    /* === CARDS === */
    .card {
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 0;
      background: linear-gradient(135deg, var(--primary-500), var(--accent-500));
      transition: height 0.3s ease;
    }

    .card:hover {
      border-color: var(--primary-300);
      box-shadow: var(--shadow-lg), 0 0 20px rgba(139, 92, 246, 0.1);
      transform: translateY(-4px);
    }

    .card:hover::before {
      height: 100%;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--gray-100);
      position: relative;
    }

    .card-header::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary-500), var(--accent-500));
      transition: width 0.4s ease;
    }

    .card:hover .card-header::after {
      width: 100%;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary-500), var(--accent-500));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      box-shadow: var(--shadow-md);
      transition: var(--transition-bounce);
    }

    .card:hover .card-icon {
      transform: rotate(10deg) scale(1.1);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gray-800);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* === FORM ELEMENTS === */
    .input-group {
      margin-bottom: 16px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
      transition: var(--transition-fast);
    }

    .label-icon {
      width: 18px;
      height: 18px;
      color: var(--primary-500);
      transition: var(--transition-fast);
    }

    label:hover .label-icon {
      transform: scale(1.2);
      color: var(--primary-600);
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-md);
      background: var(--white);
      font-size: 0.9375rem;
      font-family: inherit;
      transition: var(--transition);
      color: var(--gray-900);
      position: relative;
    }

    input[type="text"]:hover,
    textarea:hover,
    select:hover {
      border-color: var(--gray-300);
      background: var(--gray-50);
      transform: translateY(-1px);
    }

    input::placeholder, textarea::placeholder {
      color: var(--gray-400);
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary-500);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1), var(--shadow-md);
      background: var(--gray-50);
      transform: translateY(-2px);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='14' height='8' viewBox='0 0 14 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L7 7L13 1' stroke='%238B5CF6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 45px;
    }

    /* === FILE UPLOAD === */
    .file-upload-wrapper {
      position: relative;
    }

    input[type="file"] {
      display: none;
    }

    .file-upload-label {
      width: 100%;
      padding: 24px;
      border: 3px dashed var(--gray-300);
      border-radius: var(--radius-md);
      background: var(--gray-50);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .file-upload-label::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.05), rgba(59, 130, 246, 0.05));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .file-upload-label:hover {
      border-color: var(--primary-500);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .file-upload-label:hover::before {
      opacity: 1;
    }

    .upload-icon {
      width: 44px;
      height: 44px;
      color: var(--primary-500);
      transition: var(--transition-bounce);
    }

    .file-upload-label:hover .upload-icon {
      transform: translateY(-5px) scale(1.1);
      filter: drop-shadow(0 4px 8px rgba(139, 92, 246, 0.3));
    }

    .upload-text {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--gray-700);
    }

    .upload-hint {
      font-size: 0.75rem;
      color: var(--gray-500);
    }

    #file-status {
      font-size: 0.8125rem;
      color: var(--success-600);
      margin-top: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: slide-in-up 0.4s ease;
    }

    @keyframes slide-in-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #image-preview-container {
      margin-top: 16px;
      padding: 16px;
      background: var(--gray-50);
      border-radius: var(--radius-md);
      border: 2px solid var(--gray-200);
      text-align: center;
      animation: fade-in 0.4s ease;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #image-preview {
      max-width: 100%;
      max-height: 220px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xl);
      margin-bottom: 12px;
      transition: var(--transition);
    }

    #image-preview:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-2xl);
    }

    /* === BUTTONS === */
    button {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.9375rem;
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }

    button .icon {
      width: 20px;
      height: 20px;
      transition: var(--transition-bounce);
    }

    button:hover .icon {
      transform: scale(1.2);
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
      pointer-events: none;
    }

    button:active::before {
      width: 500px;
      height: 500px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-600) 0%, var(--accent-600) 100%);
      color: var(--white);
      box-shadow: var(--shadow-lg);
      font-size: 1.0625rem;
      padding: 18px 24px;
      font-weight: 700;
      position: relative;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 100%);
      border-radius: var(--radius-md);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: var(--shadow-2xl), var(--shadow-glow-strong);
      transform: translateY(-4px);
      background: linear-gradient(135deg, var(--primary-600) 0%, var(--accent-600) 100%);
    }

    .btn-primary:hover:not(:disabled)::after {
      opacity: 1;
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success-500), var(--success-600));
      color: var(--white);
      box-shadow: var(--shadow-md);
    }

    .btn-success:hover:not(:disabled) { 
      background: linear-gradient(135deg, var(--success-600), #047857);
      box-shadow: var(--shadow-xl);
      transform: translateY(-3px);
    }

    .btn-danger {
      background: var(--white);
      color: var(--danger-500);
      border: 2px solid var(--danger-400);
      box-shadow: var(--shadow-sm);
    }

    .btn-danger:hover:not(:disabled) { 
      background: var(--danger-500);
      color: var(--white);
      border-color: var(--danger-600);
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }

    .btn-warning {
      background: linear-gradient(135deg, var(--warning-500), var(--warning-600));
      color: var(--white);
      box-shadow: var(--shadow-md);
    }

    .btn-warning:hover:not(:disabled) { 
      background: linear-gradient(135deg, var(--warning-600), #B45309);
      box-shadow: var(--shadow-xl);
      transform: translateY(-3px);
    }

    .btn-warning.recording {
      background: linear-gradient(135deg, var(--success-500), var(--success-600));
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { 
        box-shadow: var(--shadow-md), 0 0 20px rgba(16, 185, 129, 0.4);
        transform: scale(1);
      }
      50% { 
        box-shadow: var(--shadow-xl), 0 0 35px rgba(16, 185, 129, 0.7);
        transform: scale(1.02);
      }
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    #clear-image-btn {
      background: var(--white);
      color: var(--gray-700);
      border: 2px solid var(--gray-300);
      padding: 10px 18px;
      font-size: 0.875rem;
      width: auto;
      margin: 0 auto;
      transition: var(--transition);
    }

    #clear-image-btn:hover {
      background: var(--gray-100);
      border-color: var(--gray-400);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* === STATUS MESSAGE === */
    #status {
      margin-top: 20px;
      padding: 18px 20px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
      border: 2px solid #FBBF24;
      color: #92400E;
      line-height: 1.6;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-md);
      animation: status-appear 0.5s ease;
    }

    @keyframes status-appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #status .icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      animation: icon-bounce 2s infinite;
    }

    @keyframes icon-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* === HELPER TEXT === */
    .helper-text {
      font-size: 0.75rem;
      color: var(--gray-500);
      margin-top: 8px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .helper-text .icon {
      width: 14px;
      height: 14px;
    }

    /* === SCROLLBAR === */
    .content::-webkit-scrollbar {
      width: 8px;
    }

    .content::-webkit-scrollbar-track {
      background: var(--gray-100);
    }

    .content::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, var(--primary-400), var(--accent-400));
      border-radius: 4px;
    }

    .content::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, var(--primary-500), var(--accent-500));
    }

    /* === ANIMATIONS === */
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      animation: slideInUp 0.5s ease backwards;
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4) { animation-delay: 0.4s; }

    .recording-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .recording-dot {
      width: 10px;
      height: 10px;
      background: #DC2626;
      border-radius: 50%;
      animation: pulse-dot 1.5s infinite;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
    }

    @keyframes pulse-dot {
      0%, 100% { 
        opacity: 1; 
        transform: scale(1);
        box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
      }
      50% { 
        opacity: 0.6; 
        transform: scale(1.3);
        box-shadow: 0 0 20px rgba(220, 38, 38, 0.8);
      }
    }

    /* === Progress Bar Effect === */
    .progress-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.8), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      to {
        left: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Background Particles -->
  <div class="bg-particles" id="particles"></div>

  <div class="container">
    <div class="header">
      <div class="header-content">
        <div class="logo-icon">
          <i data-lucide="sparkles" style="width: 30px; height: 30px; color: white;"></i>
        </div>
        <div class="header-text">
          <h1>FiLLORA</h1>
          <p class="subtitle">AI-Powered Form Autofill Agent</p>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- Profile Manager Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon">
            <i data-lucide="user-circle" style="width: 22px; height: 22px;"></i>
          </div>
          <span class="card-title">Profile Manager</span>
        </div>
        
        <div class="input-group">
          <label>
            <i data-lucide="folder-open" class="label-icon"></i>
            Saved Profiles
          </label>
          <select id="profile-select">
            <option value="">-- Create New Profile --</option>
          </select>
        </div>

        <div class="input-group">
          <label>
            <i data-lucide="edit-3" class="label-icon"></i>
            Profile Name
          </label>
          <input type="text" id="profile-name" placeholder="e.g., Senior Developer Resume, Job App 2025" />
        </div>

        <div class="btn-group">
          <button id="save-profile-btn" class="btn-success">
            <i data-lucide="save" class="icon"></i>
            Save
          </button>
          <button id="delete-profile-btn" class="btn-danger">
            <i data-lucide="trash-2" class="icon"></i>
            Delete
          </button>
        </div>
      </div>

      <!-- Document Upload Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon">
            <i data-lucide="file-text" style="width: 22px; height: 22px;"></i>
          </div>
          <span class="card-title">Document Input</span>
        </div>
        
        <div class="input-group">
          <label>
            <i data-lucide="upload" class="label-icon"></i>
            Upload Document
          </label>
          <div class="file-upload-wrapper">
            <input type="file" id="image-upload" accept="image/png, image/jpeg, image/webp" />
            <label for="image-upload" class="file-upload-label">
              <i data-lucide="cloud-upload" class="upload-icon"></i>
              <span class="upload-text">Click to upload or drag & drop</span>
              <span class="upload-hint">PNG, JPG or WEBP (MAX. 10MB)</span>
            </label>
          </div>
          <div id="file-status"></div>
        </div>

        <div id="image-preview-container" style="display: none;">
          <img id="image-preview" alt="Document preview" />
          <button id="clear-image-btn">
            <i data-lucide="x" style="width: 16px; height: 16px;"></i>
            Remove Image
          </button>
        </div>

        <div class="input-group">
          <label>
            <i data-lucide="file-edit" class="label-icon"></i>
            Profile Text
          </label>
          <textarea id="user-profile" placeholder="Paste your resume, bio, or let FiLLORA extract from image/voice..."></textarea>
          <p class="helper-text">
            <i data-lucide="info" class="icon"></i>
            Your information will be used to intelligently fill forms
          </p>
        </div>
      </div>

      <!-- Settings Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon">
            <i data-lucide="settings" style="width: 22px; height: 22px;"></i>
          </div>
          <span class="card-title">Preferences</span>
        </div>
        
        <div class="input-group">
          <label>
            <i data-lucide="message-circle" class="label-icon"></i>
            Response Tone
          </label>
          <select id="tone-select">
            <option value="professional">Professional (Default)</option>
            <option value="friendly and compassionate">Friendly & Compassionate</option>
            <option value="academic">Academic / Formal</option>
            <option value="concise">Concise & Direct</option>
          </select>
        </div>

        <div class="input-group">
          <label>
            <i data-lucide="globe" class="label-icon"></i>
            Target Language
          </label>
          <input type="text" id="language-input" value="English" placeholder="e.g., Spanish, French, Hindi..." />
        </div>
      </div>

      <!-- Main Actions Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon">
            <i data-lucide="zap" style="width: 22px; height: 22px;"></i>
          </div>
          <span class="card-title">Actions</span>
        </div>
        
        <button id="fill-btn" class="btn-primary">
          <i data-lucide="wand-2" class="icon"></i>
          Fill Form Intelligently
        </button>

        <button id="record-btn" class="btn-warning" style="margin-top: 12px;">
          <i data-lucide="mic" class="icon"></i>
          <span id="record-text">Start Voice Bio</span>
        </button>

        <div id="status">
          <i data-lucide="check-circle" class="icon"></i>
          <span>Ready to analyze and fill the current form!</span>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
